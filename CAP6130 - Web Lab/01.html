<!DOCTYPE html>
<html>

<head>
  <title>Online Course Enrolment Form</title>
</head>

<body>
  <h2>Online Course Enrolment Form</h2>
  <form action="#" method="post">
    <fieldset>
      <legend>Personal Details</legend>
      Name: <input type="text" name="name" placeholder="Harshil Prajapati" pattern="[A-Za-z ]+" required
        autofocus><br><br>
      Email: <input type="email" name="email" placeholder="harshil@harshilprajapati.com" required><br><br>
      Password: <input type="password" name="pw" minlength="6" required><br><br>
      Gender: <input type="radio" name="g" value="M" required>Male <input type="radio" name="g" value="F">Female<br><br>
      DOB: <input type="date" name="dob" min="1980-01-01" max="2008-12-31" required><br><br>
      Photo: <input type="file" name="pic" accept="image/*">
    </fieldset>
    <fieldset>
      <legend>Course Preferences</legend>
      Interests: <input type="checkbox" name="i" value="web">Web <input type="checkbox" name="i" value="ai">AI <input
        type="checkbox" name="i" value="db">Database<br><br>
      Course: <select name="course" required>
        <option value="">--Select--</option>
        <option>MCA</option>
        <option>BCA</option>
        <option>MBA</option>
      </select><br><br>
      Experience (0-10): <input type="range" name="exp" min="0" max="10" value="5">
    </fieldset><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>

</html>
